openapi: 3.0.3
info:
  title: CAB System API - UC26 quan ly tai khoan
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC26-quan-ly-tai-khoan của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Admin
security:
- bearerAuth: []
paths:
  /admin/accounts:
    get:
      tags:
      - Admin
      summary: UC26 - Danh sách tài khoản
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: role
        in: query
        schema:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATOR
          - ADMIN
      responses:
        '200':
          description: Danh sách tài khoản
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
      - Admin
      summary: UC26 - Tạo tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công
        '409':
          description: Tài khoản đã tồn tại
  /admin/accounts/{accountId}:
    put:
      tags:
      - Admin
      summary: UC26 - Cập nhật tài khoản
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountUpdateRequest'
      responses:
        '200':
          description: Cập nhật tài khoản thành công
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/accounts/{accountId}/status:
    patch:
      tags:
      - Admin
      summary: UC26 - Khóa / mở khóa tài khoản
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - ACTIVE
                  - LOCKED
      responses:
        '200':
          description: Cập nhật trạng thái tài khoản thành công
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATOR
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
    RegisterRequest:
      type: object
      required:
      - fullName
      - phone
      - password
      - role
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATOR
          - ADMIN
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
    AdminAccountUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATOR
          - ADMIN
  responses:
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
