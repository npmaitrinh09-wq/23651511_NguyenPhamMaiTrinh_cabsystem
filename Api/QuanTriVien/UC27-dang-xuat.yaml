openapi: 3.0.3
info:
  title: CAB System API - UC27 dang xuat
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC27-dang-xuat của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
security:
- bearerAuth: []
paths:
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: UC27 - Đăng xuất
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thành công
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
  responses:
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
