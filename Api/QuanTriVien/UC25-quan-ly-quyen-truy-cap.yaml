openapi: 3.0.3
info:
  title: CAB System API - UC25 quan ly quyen truy cap
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC25-quan-ly-quyen-truy-cap của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Admin
security:
- bearerAuth: []
paths:
  /admin/roles:
    get:
      tags:
      - Admin
      summary: UC25 - Xem danh sách vai trò và quyền
      responses:
        '200':
          description: Danh sách vai trò và quyền
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
  /admin/roles/{roleId}/permissions:
    put:
      tags:
      - Admin
      summary: UC25 - Cập nhật quyền truy cập
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permissions
              properties:
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Cập nhật quyền thành công
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  responses:
    Forbidden:
      description: Không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: OPERATOR
        permissions:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
