openapi: 3.0.3
info:
  title: CAB System API - UC04 dat xe
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC04-dat-xe của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Customer
- name: Trips
security:
- bearerAuth: []
paths:
  /trips:
    post:
      tags:
      - Customer
      - Trips
      summary: UC04 - Đặt xe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Không tìm được tài xế phù hợp
components:
  schemas:
    CreateTripRequest:
      type: object
      required:
      - pickup
      - destination
      - vehicleType
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - BIKE
          - CAR
        paymentMethod:
          type: string
          enum:
          - CASH
          - ELECTRONIC
          example: CASH
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.8231
        longitude:
          type: number
          format: double
          example: 106.6297
        address:
          type: string
          example: Go Vap, TP.HCM
    Trip:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        customerId:
          type: integer
          example: 10
        driverId:
          type: integer
          nullable: true
          example: 22
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - BIKE
          - CAR
        status:
          $ref: '#/components/schemas/TripStatus'
        estimatedArrivalMinutes:
          type: integer
          nullable: true
          example: 5
        fare:
          type: number
          format: double
          nullable: true
          example: 45000
        createdAt:
          type: string
          format: date-time
    TripStatus:
      type: string
      enum:
      - SEARCHING_DRIVER
      - DRIVER_ASSIGNED
      - ARRIVED_PICKUP
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
