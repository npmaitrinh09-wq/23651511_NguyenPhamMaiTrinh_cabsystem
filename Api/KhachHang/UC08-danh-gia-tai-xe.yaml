openapi: 3.0.3
info:
  title: CAB System API - UC08 danh gia tai xe
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC08-danh-gia-tai-xe của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Customer
- name: Trips
security:
- bearerAuth: []
paths:
  /trips/{tripId}/rating:
    post:
      tags:
      - Customer
      - Trips
      summary: UC08 - Đánh giá tài xế
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        example: 1001
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
    RatingRequest:
      type: object
      required:
      - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tai xe than thien
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
