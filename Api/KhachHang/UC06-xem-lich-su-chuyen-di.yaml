openapi: 3.0.3
info:
  title: CAB System API - UC06 xem lich su chuyen di
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC06-xem-lich-su-chuyen-di của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Customer
- name: Trips
security:
- bearerAuth: []
paths:
  /trips:
    get:
      tags:
      - Customer
      - Trips
      summary: UC06 - Xem lịch sử chuyến đi
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TripStatus'
      responses:
        '200':
          description: Danh sách chuyến đi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
components:
  schemas:
    Trip:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        customerId:
          type: integer
          example: 10
        driverId:
          type: integer
          nullable: true
          example: 22
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - BIKE
          - CAR
        status:
          $ref: '#/components/schemas/TripStatus'
        estimatedArrivalMinutes:
          type: integer
          nullable: true
          example: 5
        fare:
          type: number
          format: double
          nullable: true
          example: 45000
        createdAt:
          type: string
          format: date-time
    TripStatus:
      type: string
      enum:
      - SEARCHING_DRIVER
      - DRIVER_ASSIGNED
      - ARRIVED_PICKUP
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.8231
        longitude:
          type: number
          format: double
          example: 106.6297
        address:
          type: string
          example: Go Vap, TP.HCM
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
