openapi: 3.0.3
info:
  title: CAB System API - UC09 huy chuyen
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC09-huy-chuyen của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Customer
- name: Trips
security:
- bearerAuth: []
paths:
  /trips/{tripId}/cancel:
    patch:
      tags:
      - Customer
      - Trips
      summary: UC09 - Hủy chuyến
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Thay đổi kế hoạch
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '409':
          description: Chuyến đã bắt đầu hoặc không còn đủ điều kiện hủy
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        example: 1001
  responses:
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
    Trip:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        customerId:
          type: integer
          example: 10
        driverId:
          type: integer
          nullable: true
          example: 22
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - BIKE
          - CAR
        status:
          $ref: '#/components/schemas/TripStatus'
        estimatedArrivalMinutes:
          type: integer
          nullable: true
          example: 5
        fare:
          type: number
          format: double
          nullable: true
          example: 45000
        createdAt:
          type: string
          format: date-time
    TripStatus:
      type: string
      enum:
      - SEARCHING_DRIVER
      - DRIVER_ASSIGNED
      - ARRIVED_PICKUP
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.8231
        longitude:
          type: number
          format: double
          example: 106.6297
        address:
          type: string
          example: Go Vap, TP.HCM
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
