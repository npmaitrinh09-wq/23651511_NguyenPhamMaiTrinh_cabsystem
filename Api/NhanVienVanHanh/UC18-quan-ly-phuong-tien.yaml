openapi: 3.0.3
info:
  title: CAB System API - UC18 quan ly phuong tien
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC18-quan-ly-phuong-tien của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Operation
security:
- bearerAuth: []
paths:
  /operations/vehicles:
    get:
      tags:
      - Operation
      summary: UC18 - Quản lý phương tiện
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
  /operations/vehicles/{vehicleId}:
    put:
      tags:
      - Operation
      summary: UC18 - Cập nhật phương tiện
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật thành công
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    VehicleRequest:
      type: object
      required:
      - plateNumber
      - vehicleType
      properties:
        plateNumber:
          type: string
          example: 59A1-12345
        vehicleType:
          type: string
          enum:
          - BIKE
          - CAR
        brand:
          type: string
          example: Honda
        model:
          type: string
          example: Vision
        color:
          type: string
          example: Black
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
    Vehicle:
      allOf:
      - type: object
        properties:
          id:
            type: integer
          driverId:
            type: integer
      - $ref: '#/components/schemas/VehicleRequest'
  responses:
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
