openapi: 3.0.3
info:
  title: CAB System API - UC22 tra cuu lich su giao dich
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC22-tra-cuu-lich-su-giao-dich của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Operation
security:
- bearerAuth: []
paths:
  /operations/transactions:
    get:
      tags:
      - Operation
      summary: UC22 - Tra cứu lịch sử giao dịch
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
components:
  schemas:
    Payment:
      type: object
      properties:
        id:
          type: integer
        tripId:
          type: integer
        amount:
          type: number
          format: double
        method:
          type: string
          enum:
          - CASH
          - ELECTRONIC
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
        transactionCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
