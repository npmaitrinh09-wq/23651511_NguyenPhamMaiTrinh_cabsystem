openapi: 3.0.3
info:
  title: CAB System API - UC20 theo doi trang thai tai xe
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC20-theo-doi-trang-thai-tai-xe của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Operation
security:
- bearerAuth: []
paths:
  /operations/drivers/status:
    get:
      tags:
      - Operation
      summary: UC20 - Theo dõi trạng thái tài xế
      responses:
        '200':
          description: Danh sách trạng thái tài xế
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    driverId:
                      type: integer
                    status:
                      $ref: '#/components/schemas/DriverStatus'
                    location:
                      $ref: '#/components/schemas/Location'
                    currentTripId:
                      type: integer
                      nullable: true
components:
  schemas:
    DriverStatus:
      type: string
      enum:
      - OFFLINE
      - AVAILABLE
      - BUSY
      - SUSPENDED
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.8231
        longitude:
          type: number
          format: double
          example: 106.6297
        address:
          type: string
          example: Go Vap, TP.HCM
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
