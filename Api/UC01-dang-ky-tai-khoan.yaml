openapi: 3.0.3
info:
  title: CAB System API - UC01 dang ky tai khoan
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC01-dang-ky-tai-khoan của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: UC01 - Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Tài khoản đã tồn tại
components:
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
    RegisterRequest:
      type: object
      required:
      - fullName
      - phone
      - password
      - role
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATOR
          - ADMIN
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thành công
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
