openapi: 3.0.3
info:
  title: CAB System API - UC11 cap nhat trang thai hoat dong
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC11-cap-nhat-trang-thai-hoat-dong của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Driver
security:
- bearerAuth: []
paths:
  /driver/status:
    patch:
      tags:
      - Driver
      summary: UC11 - Cập nhật trạng thái hoạt động
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/DriverStatus'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '409':
          description: Tài xế không đủ điều kiện hoạt động
components:
  schemas:
    DriverStatus:
      type: string
      enum:
      - OFFLINE
      - AVAILABLE
      - BUSY
      - SUSPENDED
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
