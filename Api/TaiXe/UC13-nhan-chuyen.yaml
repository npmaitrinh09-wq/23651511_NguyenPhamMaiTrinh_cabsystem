openapi: 3.0.3
info:
  title: CAB System API - UC13 nhan chuyen
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC13-nhan-chuyen của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Driver
security:
- bearerAuth: []
paths:
  /driver/trips/{tripId}/accept:
    post:
      tags:
      - Driver
      summary: UC13 - Nhận chuyến
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Nhận chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '409':
          description: Chuyến đã được tài xế khác nhận
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        example: 1001
  schemas:
    Trip:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        customerId:
          type: integer
          example: 10
        driverId:
          type: integer
          nullable: true
          example: 22
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - BIKE
          - CAR
        status:
          $ref: '#/components/schemas/TripStatus'
        estimatedArrivalMinutes:
          type: integer
          nullable: true
          example: 5
        fare:
          type: number
          format: double
          nullable: true
          example: 45000
        createdAt:
          type: string
          format: date-time
    TripStatus:
      type: string
      enum:
      - SEARCHING_DRIVER
      - DRIVER_ASSIGNED
      - ARRIVED_PICKUP
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.8231
        longitude:
          type: number
          format: double
          example: 106.6297
        address:
          type: string
          example: Go Vap, TP.HCM
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
