openapi: 3.0.3
info:
  title: CAB System API - UC10 quan ly phuong tien ca nhan
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC10-quan-ly-phuong-tien-ca-nhan của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Driver
security:
- bearerAuth: []
paths:
  /driver/vehicle:
    get:
      tags:
      - Driver
      summary: UC10 - Xem phương tiện cá nhân
      responses:
        '200':
          description: Thông tin phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    put:
      tags:
      - Driver
      summary: UC10 - Quản lý phương tiện cá nhân
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    VehicleRequest:
      type: object
      required:
      - plateNumber
      - vehicleType
      properties:
        plateNumber:
          type: string
          example: 59A1-12345
        vehicleType:
          type: string
          enum:
          - BIKE
          - CAR
        brand:
          type: string
          example: Honda
        model:
          type: string
          example: Vision
        color:
          type: string
          example: Black
    Vehicle:
      allOf:
      - type: object
        properties:
          id:
            type: integer
          driverId:
            type: integer
      - $ref: '#/components/schemas/VehicleRequest'
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
