openapi: 3.0.3
info:
  title: CAB System API - UC14 tu choi chuyen
  version: 1.0.0
  description: OpenAPI riêng cho chức năng UC14-tu-choi-chuyen của CAB System.
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Driver
security:
- bearerAuth: []
paths:
  /driver/trips/{tripId}/reject:
    post:
      tags:
      - Driver
      summary: UC14 - Từ chối chuyến
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Đã ghi nhận từ chối và tiếp tục tìm tài xế khác
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        example: 1001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
